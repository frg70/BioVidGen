# BioVidGen — discovery-process-mapper spec (input for process-tech-spec)
# Date: 2026-11-05. Narrative: discovery-process-map.md. Unknowns: [specify: ...]. Assumptions: ASSUMPTION: prefix.
discovery:
  mode: light            # + full-depth mapping, non-commercial adaptation
  verdict: go_with_risks
  market: {type: resegmented, tam: "1.29M health-science students (MX, 2023-24)", sam: "310k-580k (ASSUMPTION shares)", som: "1k-5k installs in 24 months", confidence: yellow}
  competitors:
    - {name: "ChatGPT/Gemini/Copilot free", type: indirect, weakness: "no verbatim evidence check; no retraction/preprint status"}
    - {name: "Browser-native AI page summaries", type: potential, weakness: "generic; no appraisal structure; [specify: verify availability in MX]"}
    - {name: SciSpace, type: direct, weakness: "free tier capped; paid; English-first"}
    - {name: Elicit, type: direct, weakness: "researcher-oriented; English"}
    - {name: Consensus, type: direct, weakness: "multi-paper Q&A, not single-paper appraisal"}
    - {name: "Citicious (MIT) / Retraction Alert / RetractCheck / Zotero+RW", type: substitute, weakness: "status only, no summaries"}
    - {name: "Browser translation", type: substitute, weakness: "translation is not structure"}
  segments:
    - {name: "Health-science undergrads in partner courses/journal clubs (MX)", jobs: ["understand an English article fast", "verify understanding against the text", "avoid citing retracted/preprint work", "prepare appraisal sheet"], willingness_to_pay: "$0"}
    - {name: "Instructors / journal-club moderators", jobs: ["students arrive having understood methods", "no retracted papers cited"], willingness_to_pay: "$0; time to recommend"}
  job_map:
    - {stage: define, action: "choose/receive topic", pain: low, importance: 6, satisfaction: 6, os: 6, mapped_to: []}
    - {stage: locate, action: "search and pick papers", pain: "relevance unclear", importance: 7, satisfaction: 6, os: 8, mapped_to: [OP1, OP12]}
    - {stage: prepare, action: "get text; check status", pain: "status rarely checked", importance: 6, satisfaction: 4, os: 8, mapped_to: [OP3, OP12]}   # instructor view: I9 S3 OS15
    - {stage: confirm, action: "understand prerequisites", pain: "jargon/stats", importance: 7, satisfaction: 4, os: 10, mapped_to: [OP5]}
    - {stage: execute, action: "comprehend methods/results/conclusions in English", pain: "slow, tiring", importance: 9, satisfaction: 3, os: 15, mapped_to: [OP4, OP5, OP11]}
    - {stage: monitor, action: "check summary against paper", pain: "cannot verify AI output", importance: 8, satisfaction: 3, os: 13, mapped_to: [OP5V]}
    - {stage: modify, action: "re-read, ask peers", pain: "social cost", importance: 6, satisfaction: 5, os: 7, mapped_to: [OP14]}
    - {stage: conclude, action: "write appraisal sheet", pain: "re-finding quotes", importance: 8, satisfaction: 4, os: 12, mapped_to: [OP13]}
  value_proposition: "Entiende cualquier artículo en inglés en español, con la frase exacta que respalda cada punto y su estado de retractación o preprint — gratis, en tu navegador."
  main_scenario: {segment: "health-science undergrads in partner courses (MX)", monetisation: none, price: "$0", cac: "ASSUMPTION: ~1 h instructor time per cohort", churn: "semester-bound"}
  hypotheses:
    - {id: H-N1, type: need, statement: ">45 min per English article; translator/ChatGPT used", risk: medium, method: "10 Mom-Test interviews", criterion: ">=7/10", tested_by: [], status: untested}
    - {id: H-D1, type: demand, statement: "instructor recommendation drives install and use", risk: high, method: "cohort offer after E0", criterion: ">=40% install in 2 wk; >=40% of installers active wk 4", tested_by: [OP1, OP3, OP12], status: untested}
    - {id: H-V1, type: value, statement: "evidence summary cuts minutes/article >=30% without accuracy loss", risk: high, method: "concierge then live tool", criterion: ">=30% reduction; non-inferior accuracy [specify: margin]", tested_by: [OP11, OP5, OP5V, OP13], status: untested}
    - {id: H-V2, type: value, statement: "students prefer verified summary over free ChatGPT summary", risk: high, method: "blind comparison + planted-error task", criterion: ">=60% preference and more errors detected", tested_by: [OP11, OP5V], status: untested}
    - {id: H-S1, type: solution, statement: "a $0 provider meets >=80% agreement and 100% quote validity on student hardware/free key", risk: high, method: "spikes S1/S5 + gold-set eval", criterion: "gate met by >=1 path available to >=70% of cohort", tested_by: [OP5, OP5V], status: untested}
    - {id: H-S2, type: solution, statement: ">=70% of target pages yield usable section text", risk: medium, method: "50-page sample", criterion: ">=70%", tested_by: [OP4], status: untested}
    - {id: H-C1, type: channel, statement: "instructors at >=2 institutions recommend it", risk: medium, method: "demo to 5-8 instructors", criterion: ">=2 commit", tested_by: [OP12], status: untested}
    - {id: H-Sc1, type: scalability, statement: "$0/month team cost and <=8 h/month maintenance at 5k users", risk: medium, method: "model + one semester tracking", criterion: "holds", tested_by: [], status: untested}
  red_flags:
    - {signal: "No differentiation (amber)", value: "components exist free elsewhere; only combination + verified quotes unique", action: "test H-V2 before E2; keep 'verifier' pivot ready"}
  readiness: {stage: idea, score: "4.5/8 (adapted, non-commercial)", gaps: ["pain not confirmed by interviews", "no retention data", "no traction", "maintenance capacity unknown"]}
process:
  name: "BioVidGen local-first article comprehension and status check"
  problems:
    - "P1 English methods/results take students too long (minutes/article)"
    - "P2 students cannot verify AI summaries against the text"
    - "P3 retracted/preprint/EoC papers used unknowingly"
    - "P4 appraisal sheet assembly is slow"
  objective: "minimize minutes_per_article subject to appraisal_accuracy non-inferior, quote_validity = 100%, field_agreement >= 80%, team_cost = $0/month"
  target_variable: {name: minutes_per_article, formula: "observed or self-timed minutes from open to completed appraisal, per article", unit: min}
  kpis:
    - {name: install_rate, formula: "installs / invited cohort", unit: "%", target: ">=40% in 2 weeks"}
    - {name: week4_active, formula: "users active in week 4 / installers (survey or opt-in counts)", unit: "%", target: ">=40%"}
    - {name: sean_ellis, formula: "'very disappointed' / respondents", unit: "%", target: ">=40%"}
    - {name: time_reduction, formula: "1 - minutes_with_tool / minutes_baseline", unit: "%", target: ">=30%"}
  as_is_baseline: {cycle_time: "ASSUMPTION 2-3.5 h per article", throughput: "2-4 articles/student/month", cost_per_unit: "$0 cash; student time", defect_rate: "[pending]", bottleneck: "Execute (English comprehension)"}
  end_to_end_error_budget: {target_yield: ">=0.60 full verified summary; >=0.94 metadata+status", per_operation_targets: {OP1: "0.97", OP3: "0.97", OP4: "0.80", OP5_OP5V: "0.85 (>=3 of 4 sections verified)", OP12: "0.97"}}
unit_economics:
  price_per_unit: "$0"
  ops_cost_per_unit: "$0 to team (runs on user machine); user: $0 within free quotas"
  infra_cost_per_unit: "$0 (no backend); $5 one-off Chrome Web Store fee"
  gross_margin: {value: "N/A (no revenue)", target: "team cash cost = $0/month; user quota headroom >= 3x"}
  ltv_cac: "N/A"
  gap_closers:
    - {operation: OP11, migration: "full concierge annotation -> audit-only (~10 articles per prompt/model change)", trigger: "gold set >=60 articles AND OP5 agreement >=80% on holdout", new_cost: "~20 expert-h per change vs 105-135 h initial"}
entities:
  - name: PageContext
    identity: {key: "tab_id + url", type: surrogate, dedup_rule: "latest navigation wins"}
    storage: document   # memory only
    invariants: ["kind = article => doi or pmid or title present"]
    interface: [detectPaper]
    properties:
      - {name: doi, type: string, unit: "", source_field: "citation_doi | dc.identifier | JSON-LD | URL regex", certainty: measured, confidence: "inferred when regex-only", visibility: public, crud: {create: OP1, read: SP, update: OP1, delete: "tab close"}}
      - {name: kind, type: "enum{article,result_list,other}", unit: "", source_field: "OP1 rules", certainty: inferred, confidence: "", visibility: internal, crud: {create: OP1, read: SP, update: OP1, delete: "tab close"}}
    relationships:
      - {to: Article, relation: identifies, cardinality: "N:1", optional: true, ownership: reference}
  - name: Article
    identity: {key: normalized_doi, type: natural, dedup_rule: "lowercase DOI without resolver prefix; fallback openalex_id, then url hash; preprint and published linked not merged"}
    storage: document   # IndexedDB
    invariants: ["year <= current year", "keywords carry source tag"]
    interface: [upsertFromOpenAlex, upsertFromCrossref, read]
    properties:
      - {name: authors, type: "list", unit: "", source_field: "OpenAlex authorships", certainty: measured, confidence: green, visibility: public, crud: {create: OP3, read: all, update: "refresh 30d", delete: "clear all"}}
      - {name: keywords, type: "list{term,source}", unit: "", source_field: "page meta ∪ OpenAlex keywords/topics", certainty: measured, confidence: green, visibility: public, crud: {create: OP3, read: all, update: "refresh 30d", delete: "clear all"}}
      - {name: type, type: string, unit: "", source_field: "OpenAlex type / Crossref type", certainty: measured, confidence: green, visibility: public, crud: {create: OP3, read: OP12, update: refresh, delete: "clear all"}}
      - {name: oa_url, type: url, unit: "", source_field: "Unpaywall/OpenAlex", certainty: measured, confidence: yellow, visibility: internal, crud: {create: OP3, read: OP4, update: refresh, delete: "clear all"}}
    relationships:
      - {to: StatusCheck, relation: has, cardinality: "1:N", optional: false, ownership: composition}
      - {to: ArticleText, relation: has, cardinality: "1:N", optional: true, ownership: composition}
      - {to: Summary, relation: has, cardinality: "1:N", optional: true, ownership: composition}
      - {to: Article, relation: "is preprint of", cardinality: "1:1", optional: true, ownership: reference}
  - name: StatusCheck
    identity: {key: "article_key + checked_at", type: surrogate, dedup_rule: "append-only"}
    storage: document
    invariants: ["retraction only from retraction sources", "never display 'not retracted'; display 'no retraction found in {sources} on {date}'", "EoC/correction distinct from retraction"]
    interface: [checkStatus, checkStatusBatch]
    properties:
      - {name: retraction_nature, type: "enum{none_found,retraction,expression_of_concern,correction,reinstatement}", unit: "", source_field: "OpenAlex is_retracted; Crossref updates (Retraction Watch)", certainty: measured, confidence: "source-limited", visibility: public, crud: {create: OP12, read: "VW-A, VW-B, OP13", update: never, delete: "TTL GC"}}
      - {name: is_preprint, type: bool, unit: "", source_field: "type + DOI prefix + posted-content", certainty: derived, confidence: green, visibility: public, crud: {create: OP12, read: views, update: never, delete: "TTL GC"}}
      - {name: checked_at, type: timestamp, unit: UTC, source_field: system, certainty: measured, confidence: green, visibility: public, crud: {create: OP12, read: views, update: never, delete: "TTL GC"}}
    relationships: []
  - name: ArticleText
    identity: {key: "article_key + content_hash", type: surrogate, dedup_rule: "hash"}
    storage: document   # session memory by default
    invariants: ["abstract_only => summary banner 'solo resumen'"]
    interface: [acquireText]
    properties:
      - {name: sections, type: "map name->text", unit: chars, source_field: "Readability / OA XML / pdf.js", certainty: derived, confidence: "", visibility: internal, crud: {create: OP4, read: "OP5, OP5V", update: "better source", delete: "session end unless pinned"}}
      - {name: source, type: "enum{dom,oa_html,oa_xml,pdfjs,abstract_only}", unit: "", source_field: OP4, certainty: measured, confidence: green, visibility: public, crud: {create: OP4, read: views, update: OP4, delete: "session end"}}
    relationships: []
  - name: Summary
    identity: {key: "article_key + pipeline_version(prompt_hash, model_id, schema_version)", type: surrogate, dedup_rule: "same key returns cached"}
    storage: document
    invariants: ["every summary_es has >=1 verified quote or status no_verificado", "quotes are substrings of the declared section after normalisation", "numbers in summary_es appear in a quote", "prerequisite_topics labelled background_knowledge", "no quality verdict field"]
    interface: [validateAndStore, read]
    properties:
      - {name: methodology, type: "struct{summary_es, design?, n?, statistics?, evidence[]}", unit: "", source_field: "OP5 draft", certainty: inferred, confidence: "derived where quote-validated", visibility: public, crud: {create: OP5V, read: "VW-A, OP13", update: never, delete: "clear all"}}
      - {name: section_status, type: "enum{verified,no_verificado,abstract_only,failed}", unit: "", source_field: OP5V, certainty: derived, confidence: green, visibility: public, crud: {create: OP5V, read: views, update: never, delete: "clear all"}}
    relationships:
      - {to: Feedback, relation: has, cardinality: "1:N", optional: true, ownership: composition}
  - name: Feedback
    identity: {key: auto, type: surrogate, dedup_rule: "summary+section+kind"}
    storage: document
    invariants: ["never transmitted automatically"]
    interface: [markSection, exportFeedback]
    properties: []
    relationships: []
  - name: Settings
    identity: {key: singleton, type: surrogate, dedup_rule: n/a}
    storage: document   # chrome.storage.local
    invariants: ["api keys never in sync storage, logs, prompts or exports"]
    interface: [optionsPage]
    properties: []
    relationships: []
  - name: GoldItem
    identity: {key: "doi + annotator + version", type: natural, dedup_rule: "versioned"}
    storage: document   # files in eval/gold (CC-BY only if public)
    invariants: ["adjudicated version exists before use as test label"]
    interface: [annotate, adjudicate]
    properties: []
    relationships:
      - {to: Article, relation: annotates, cardinality: "N:1", optional: false, ownership: reference}
