access_control:
  model: RBAC
  matrix:
    - {actor: content_script, resource: "PageContext.*", c: true, r: true, u: true, d: true, condition: "own tab; no network; no Settings"}
    - {actor: side_panel, resource: "Article/StatusCheck/ArticleText/Summary/Feedback", c: true, r: true, u: true, d: true, condition: "user-initiated or detected article"}
    - {actor: provider_adapter, resource: "Settings.api_key", c: false, r: true, u: false, d: false, condition: "selected provider only"}
    - {actor: llm_provider_external, resource: "ArticleText.section", c: false, r: true, u: false, d: false, condition: "one section per call; nothing else"}
    - {actor: scholarly_apis_external, resource: "Article.doi", c: false, r: true, u: false, d: false, condition: "DOI/title only"}
    - {actor: user_options_page, resource: "Settings.*", c: true, r: true, u: true, d: true, condition: user}
    - {actor: annotator, resource: "GoldItem.*", c: true, r: true, u: true, d: false, condition: "PR review by QFB lead"}
  separation_of_duties: ["prompt changes require QFB review + eval pass", "gold-set adjudicator differs from annotators"]
  secrets: {storage: "chrome.storage.local (never sync); never in repo/logs/prompts/exports", rotation: "user at provider"}
  audit_log: {events: ["local debug log of op runs (no article text)", "git history for prompts and gold set"], retention: "last N=200 ops locally; git forever"}
